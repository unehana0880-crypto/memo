<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FAF9F6">
<title>Laurel — 음성 메모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap">
<style>
  :root{
    --bg:#FAF9F6;--card:#fff;--border:#EBE8E2;--dark:#1C1917;--muted:#8A8278;
    --accent:#7c6fa0;--accent-bg:#EEEDF8;--green:#3D7A52;--green-bg:#E8F5EE;
    --coral:#B85450;--coral-bg:#FBEAE9;--gold:#B8860B;--gold-bg:#FEF8E0;
    --blue:#2A5FA8;--blue-bg:#E8F0FA;--tip:#F8F6EF;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
       background:var(--bg);color:var(--dark);min-height:100vh;padding:0 0 32px;font-size:15px;line-height:1.6}
  .w{max-width:560px;margin:0 auto;padding:0 16px}

  .top{text-align:center;padding:22px 0 14px}
  .brand{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
  .title{font-family:'Cormorant Garamond',serif;font-size:25px;font-weight:600;margin:3px 0 2px}
  .sub{font-size:12px;color:var(--muted)}

  /* ── 녹음 ── */
  .mic-wrap{text-align:center;padding:6px 0 4px}
  .mic{width:112px;height:112px;border-radius:50%;border:none;background:var(--accent);color:#fff;
       font-size:44px;cursor:pointer;box-shadow:0 6px 20px rgba(124,111,160,.3);
       transition:transform .12s,background .2s;display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
  .mic:active{transform:scale(.95)}
  .mic.rec{background:var(--coral);box-shadow:0 0 0 0 rgba(184,84,80,.5);animation:pulse 1.5s infinite}
  .mic[disabled]{background:#CFCBC4;box-shadow:none;animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(184,84,80,.45)}70%{box-shadow:0 0 0 22px rgba(184,84,80,0)}100%{box-shadow:0 0 0 0 rgba(184,84,80,0)}}
  .mic-lbl{font-size:13px;color:var(--muted);margin-top:10px;min-height:20px}
  .mic-lbl b{color:var(--coral)}

  .live{background:var(--card);border:1px solid var(--border);border-radius:14px;margin:12px 0 0;
        padding:14px 15px;min-height:96px;font-size:15px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
  .live:empty::before{content:'버튼을 누르고 말씀하세요. 말이 끊겨도 계속 받아적습니다.';color:#C4BFB6;font-size:13.5px}
  .live .interim{color:var(--muted)}

  .catrow{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
  .cat{flex:1;min-width:72px;padding:9px 6px;border:1.5px solid var(--border);border-radius:11px;background:var(--card);
       font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .12s;text-align:center}
  .cat.on{border-color:transparent;color:#fff}
  .cat.on[data-c="think"]{background:var(--accent)}
  .cat.on[data-c="todo"]{background:var(--green)}
  .cat.on[data-c="stock"]{background:var(--gold)}
  .cat.on[data-c="sched"]{background:var(--blue)}
  .guess{font-size:11.5px;color:var(--muted);margin:7px 2px 0;min-height:17px}
  .fixbar{display:none;align-items:center;gap:9px;background:var(--gold-bg);border-left:3px solid var(--gold);
          border-radius:0 9px 9px 0;padding:9px 12px;margin:9px 0 0;font-size:12.5px;color:#6B5320;line-height:1.6}
  .fixbar span{flex:1}
  .fixbar button{flex-shrink:0;padding:7px 13px;border:none;border-radius:9px;background:var(--gold);color:#fff;
          font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .guess b{color:var(--accent)}

  .actrow{display:flex;gap:8px;margin:11px 0 0}
  .btn{flex:1;padding:14px;border:none;border-radius:12px;font-family:inherit;font-size:14.5px;font-weight:600;cursor:pointer}
  .btn-save{background:var(--dark);color:#fff}
  .btn-save[disabled]{background:#D8D4CD;color:#fff}
  .btn-clr{flex:0 0 82px;background:var(--card);border:1.5px solid var(--border);color:var(--muted);font-weight:500}

  /* ── 안내 ── */
  .warn{background:var(--coral-bg);border-left:3px solid var(--coral);border-radius:0 9px 9px 0;
        padding:11px 13px;margin:12px 0 0;font-size:12.5px;color:#7A3330;line-height:1.7}
  .warn b{color:var(--coral)}
  .hint{background:var(--tip);border-radius:10px;padding:11px 13px;margin:12px 0 0;font-size:12px;color:#6b6459;line-height:1.75}
  .hint b{color:var(--gold)}

  /* ── 목록 ── */
  .lsthd{display:flex;align-items:center;gap:8px;margin:26px 0 10px;padding-top:18px;border-top:1px solid var(--border)}
  .lsthd h2{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;flex:1}
  .cnt{font-size:11.5px;color:var(--muted)}
  .filt{display:flex;gap:5px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px}
  .fb{flex-shrink:0;padding:6px 13px;border:1.5px solid var(--border);border-radius:999px;background:var(--card);
      font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
  .fb.on{border-color:var(--dark);background:var(--dark);color:#fff}
  .srch{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:11px;background:var(--card);
        font-family:inherit;font-size:14px;color:var(--dark);margin-bottom:12px}
  .srch:focus{outline:none;border-color:var(--accent)}

  .daysep{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:18px 2px 7px}
  .daysep:first-of-type{margin-top:4px}

  .memo{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:8px;
        border-left:3px solid var(--border)}
  .memo[data-c="think"]{border-left-color:var(--accent)}
  .memo[data-c="todo"]{border-left-color:var(--green)}
  .memo[data-c="stock"]{border-left-color:var(--gold)}
  .memo[data-c="sched"]{border-left-color:var(--blue)}
  .memo.done{opacity:.5}
  .memo.done .mtxt{text-decoration:line-through;color:var(--muted)}
  .mtop{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .tag{font-size:10.5px;font-weight:600;border-radius:999px;padding:2px 9px}
  .tag[data-c="think"]{background:var(--accent-bg);color:var(--accent)}
  .tag[data-c="todo"]{background:var(--green-bg);color:var(--green)}
  .tag[data-c="stock"]{background:var(--gold-bg);color:var(--gold)}
  .tag[data-c="sched"]{background:var(--blue-bg);color:var(--blue)}
  .mtime{font-size:11px;color:var(--muted);flex:1}
  .mtxt{font-size:14.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;cursor:text}
  .mtxt:focus{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
  .mrow{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
  .mb{padding:5px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);
      font-family:inherit;font-size:11.5px;color:var(--muted);cursor:pointer}
  .mb.del{color:var(--coral);border-color:#F0DAD9}
  .mb.fix{color:var(--gold);border-color:#EADFB8;background:var(--gold-bg);font-weight:600}
  .mb.ok{color:var(--green);border-color:#CFE7D9}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 10px;line-height:1.8}

  .foot{display:flex;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
  .fbtn{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:11px;background:var(--card);
        font-family:inherit;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
  .bkp{font-size:11.5px;color:var(--muted);text-align:center;margin-top:9px;line-height:1.7}
  .bkp.old{color:var(--coral);font-weight:500}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--dark);color:#fff;
         font-size:13px;padding:11px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:all .22s;z-index:50;
         max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (min-width:768px){ .w{max-width:680px} }
</style>
</head>
<body>
<div class="w">

  <div class="top">
    <div class="brand">Laurel Studio</div>
    <div class="title">음성 메모</div>
    <div class="sub" id="sub">말하면 글로 바뀝니다</div>
  </div>

  <div class="mic-wrap">
    <button class="mic" id="mic" onclick="toggleRec()">🎙</button>
    <div class="mic-lbl" id="micLbl">눌러서 시작</div>
  </div>

  <div class="live" id="live"></div>

  <div class="fixbar" id="fixBar"><span>같은 말이 여러 번 적혔습니다</span><button onclick="cleanLive()">🧹 정리</button></div>
  <div class="guess" id="guess"></div>
  <div class="catrow">
    <button class="cat" data-c="think" onclick="pickCat('think')">💭 생각</button>
    <button class="cat" data-c="todo"  onclick="pickCat('todo')">✅ 할일</button>
    <button class="cat" data-c="stock" onclick="pickCat('stock')">📦 재고</button>
    <button class="cat" data-c="sched" onclick="pickCat('sched')">📅 일정</button>
  </div>

  <div class="actrow">
    <button class="btn btn-clr" onclick="clearLive()">지우기</button>
    <button class="btn btn-save" id="saveBtn" onclick="saveMemo()" disabled>저장</button>
  </div>

  <div id="support"></div>

  <div class="hint">
    <b>요령</b> — 말이 잠깐 끊겨도 녹음은 계속됩니다. 다 말하고 🎙를 한 번 더 누르면 멈춥니다.
    저장 전에 글씨를 고치고 싶으면 위 네모 칸을 눌러서 바로 고치면 됩니다.<br>
    홈 화면에 두고 쓰시려면 크롬 오른쪽 위 ⋮ → <b>홈 화면에 추가</b>.
  </div>

  <div class="lsthd">
    <h2>보관함</h2>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="filt">
    <button class="fb on" data-f="all"   onclick="setFilt('all',this)">전체</button>
    <button class="fb"    data-f="todo"  onclick="setFilt('todo',this)">✅ 할일</button>
    <button class="fb"    data-f="stock" onclick="setFilt('stock',this)">📦 재고</button>
    <button class="fb"    data-f="sched" onclick="setFilt('sched',this)">📅 일정</button>
    <button class="fb"    data-f="think" onclick="setFilt('think',this)">💭 생각</button>
    <button class="fb"    data-f="open"  onclick="setFilt('open',this)">안 끝난 할일</button>
  </div>

  <input class="srch" id="srch" type="search" placeholder="메모 안에서 찾기" oninput="paint()">

  <div id="list"></div>

  <div class="foot">
    <button class="fbtn" onclick="copyAll()">📋 전체 복사</button>
    <button class="fbtn" onclick="backup()">💾 백업 파일</button>
  </div>
  <div class="bkp" id="bkp"></div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════
   저장은 이 폰 브라우저 안에만 남습니다.
   크롬 데이터를 지우면 같이 사라지므로,
   가끔 「백업 파일」로 내려받아 두세요.
   ═══════════════════════════════════════════ */
var KEY  = 'laurel_memo_v1';
var BKEY = 'laurel_memo_backup_at';
var CAT  = { think:'💭 생각', todo:'✅ 할일', stock:'📦 재고', sched:'📅 일정' };
var CATN = { think:'생각', todo:'할일', stock:'재고', sched:'일정' };
/* 「재고로」 / 「생각으로」 — 받침에 따라 조사를 맞춥니다 */
function ro(w){
  var c = w.charCodeAt(w.length-1) - 0xAC00;
  if (c < 0 || c > 11171) return '로';
  var j = c % 28;
  return (j === 0 || j === 8) ? '로' : '으로';
}

var ITEMS = [];
var curCat = null;      /* 사용자가 직접 고른 것 */
var autoCat = 'think';  /* 말에서 짐작한 것 */
var filt = 'all';

/* ── 저장소 (없거나 막혀 있어도 앱은 돕니다) ── */
function load(){
  try {
    var raw = localStorage.getItem(KEY);
    ITEMS = raw ? (JSON.parse(raw).items || []) : [];
  } catch(e){ ITEMS = []; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({ items: ITEMS })); return true; }
  catch(e){ toast('저장 공간이 꽉 찼습니다 — 백업 후 오래된 메모를 지워주세요'); return false; }
}
function bkpAt(){ try { return Number(localStorage.getItem(BKEY) || 0); } catch(e){ return 0; } }
function setBkp(){ try { localStorage.setItem(BKEY, String(Date.now())); } catch(e){} }

function toast(m){
  var t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2300);
}

/* ═══════ 음성 인식 ═══════ */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, recording = false, finalTxt = '', wantStop = false, wake = null;
/* ★ 안드로이드 크롬은 조용해지면 인식기를 껐다 켭니다. 그때마다 results 목록이
   처음부터 다시 통째로 넘어오기 때문에, 받은 것을 「더하면」 같은 말이
   눈덩이처럼 불어납니다("우체국 우체국 우체국 택배에다…").
   그래서 더하지 않고, 받을 때마다 이번 회차 글을 「통째로 다시 씁니다」.
     baseTxt  = 지난 회차까지 확정된 글
     sessTxt  = 지금 회차에서 확정된 글 (매번 새로 계산) */
var baseTxt = '', sessTxt = '';
function joinTxt(a, b){
  a = (a || '').trim(); b = (b || '').trim();
  if (!a) return b;
  if (!b) return a;
  return a + ' ' + b;
}

function supported(){ return !!SR; }

if (!supported()){
  document.getElementById('mic').disabled = true;
  document.getElementById('micLbl').textContent = '이 브라우저는 음성 인식을 못 합니다';
  document.getElementById('support').innerHTML =
    '<div class="warn"><b>크롬으로 열어주세요.</b> 안드로이드 크롬에서 한국어 인식이 가장 잘 됩니다. ' +
    '다른 브라우저에서는 아래 칸에 손으로 적어서 저장하실 수 있습니다.</div>';
  document.getElementById('live').setAttribute('contenteditable','true');
}

function makeRec(){
  var r = new SR();
  r.lang = 'ko-KR';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onresult = function(ev){
    /* 이번 회차 전체를 처음부터 다시 읽습니다 — 같은 내용이 또 와도 불어나지 않습니다 */
    var fin = '', interim = '';
    for (var i = 0; i < ev.results.length; i++){
      var t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) fin = joinTxt(fin, t);
      else interim += t;
    }
    sessTxt = fin;
    finalTxt = joinTxt(baseTxt, sessTxt);
    paintLive(interim);
  };

  /* 안드로이드 크롬은 조용해지면 알아서 끊습니다 — 멈추라고 하지 않았으면 다시 켭니다 */
  r.onend = function(){
    /* 이번 회차분을 확정해 넘기고, 회차 글은 비웁니다 */
    baseTxt = joinTxt(baseTxt, sessTxt);
    sessTxt = '';
    finalTxt = baseTxt;
    if (recording && !wantStop){
      try { r.start(); } catch(e){ setTimeout(function(){ try{ r.start(); }catch(e2){} }, 300); }
    } else { stopUI(); }
  };

  r.onerror = function(ev){
    var e = ev.error;
    if (e === 'no-speech' || e === 'aborted') return;     /* 흔한 일 — 그냥 둡니다 */
    if (e === 'not-allowed' || e === 'service-not-allowed'){
      wantStop = true; recording = false; stopUI();
      document.getElementById('micLbl').innerHTML = '<b>마이크가 막혀 있습니다</b>';
      document.getElementById('support').innerHTML =
        '<div class="warn"><b>마이크 권한이 꺼져 있습니다.</b> 주소창 왼쪽 자물쇠 🔒 → 권한 → 마이크를 <b>허용</b>으로 바꾸고 ' +
        '화면을 새로고침해 주세요.<br>주소가 <b>https://</b> 로 시작하는지도 한 번 봐주세요 — 아니면 마이크가 안 켜집니다.</div>';
      return;
    }
    if (e === 'network'){ toast('인터넷이 끊겼습니다 — 연결 후 다시 눌러주세요'); }
  };
  return r;
}

function toggleRec(){ recording ? stopRec() : startRec(); }

function startRec(){
  if (!supported()) return;
  if (!rec) rec = makeRec();
  baseTxt = (document.getElementById('live').innerText || '').trim();
  sessTxt = ''; finalTxt = baseTxt;
  wantStop = false; recording = true;
  try { rec.start(); } catch(e){}
  document.getElementById('mic').classList.add('rec');
  document.getElementById('mic').textContent = '⏹';
  document.getElementById('micLbl').innerHTML = '<b>듣고 있습니다</b> · 끝나면 한 번 더 누르세요';
  /* 말하는 동안 화면이 꺼지지 않게 */
  if (navigator.wakeLock){
    navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){});
  }
}

function stopRec(){
  wantStop = true; recording = false;
  try { rec && rec.stop(); } catch(e){}
  stopUI();
}

function stopUI(){
  recording = false;
  var m = document.getElementById('mic');
  m.classList.remove('rec'); m.textContent = '🎙';
  document.getElementById('micLbl').textContent = finalTxt ? '고치시거나 저장하세요' : '눌러서 시작';
  if (wake){ try { wake.release(); } catch(e){} wake = null; }
  paintLive('');
}

function paintLive(interim){
  var el = document.getElementById('live');
  if (document.activeElement === el) return;   /* 손으로 고치는 중이면 건드리지 않습니다 */
  el.innerHTML = esc(finalTxt) + (interim ? '<span class="interim">' + esc(' ' + interim) + '</span>' : '');
  refreshGuess();
}

document.getElementById('live').addEventListener('input', function(){
  finalTxt = this.innerText.trim();
  baseTxt = finalTxt; sessTxt = '';     /* 고친 글이 새 기준이 됩니다 */
  refreshGuess();
});
document.getElementById('live').addEventListener('blur', function(){
  finalTxt = this.innerText.trim();
  baseTxt = finalTxt; sessTxt = '';
  paintLive('');
});
document.getElementById('live').setAttribute('contenteditable','true');

/* ═══════════════════════════════════════════════════
   같은 말이 되풀이된 것을 걷어냅니다.
   앞에서부터 보면서, 바로 뒤에 똑같은 토막이 또 나오면
   앞의 한 벌을 버립니다. 긴 토막부터 봅니다.
   ═══════════════════════════════════════════════════ */
function dedupe(txt){
  var w = String(txt || '').split(/\s+/).filter(Boolean);
  if (w.length < 4) return String(txt || '').trim();
  var out = [], i = 0, LIMIT = 60, guard = 0;
  while (i < w.length && guard++ < 20000){
    var room = Math.floor((w.length - i) / 2);
    var cap = Math.min(LIMIT, room), hit = 0;
    for (var n = cap; n >= 1; n--){
      var same = true;
      for (var k = 0; k < n; k++){
        if (w[i+k] !== w[i+n+k]){ same = false; break; }
      }
      if (same){ hit = n; break; }
    }
    if (hit) { i += hit; }            /* 앞의 한 벌은 버립니다 */
    else { out.push(w[i]); i++; }
  }
  return out.join(' ');
}
function looksRepeated(t){
  if (!t || t.length < 40) return false;
  var c = dedupe(t);
  return c.length > 0 && c.length < t.length * 0.75;
}
function cleanLive(){
  var t = (document.getElementById('live').innerText || '').trim();
  var c = dedupe(t);
  if (!c || c === t){ toast('정리할 게 없습니다'); return; }
  if (!confirm('되풀이된 부분을 걷어냅니다.\n\n' + t.length + '자 → ' + c.length + '자\n\n정리 후:\n' +
               c.slice(0, 120) + (c.length > 120 ? '…' : ''))) return;
  finalTxt = c; baseTxt = c; sessTxt = '';
  document.getElementById('live').innerText = c;
  refreshGuess();
  toast('정리했습니다');
}
function cleanOne(id){
  var it = find(id); if (!it) return;
  var c = dedupe(it.text);
  if (!c || c === it.text){ toast('정리할 게 없습니다'); return; }
  if (!confirm('되풀이된 부분을 걷어냅니다.\n\n' + it.text.length + '자 → ' + c.length + '자\n\n정리 후:\n' +
               c.slice(0, 120) + (c.length > 120 ? '…' : ''))) return;
  it.text = c; save(); paint(); toast('정리했습니다');
}

/* ═══════ 말에서 종류를 짐작합니다 ═══════ */
var RULES = [
  { c:'stock', re:/(발주|주문|시켜|시키|입고|재고|떨어졌|떨어져|다 썼|다썼|없어졌|사야|사다|구매|박스|리필|채워|채우)/ },
  { c:'sched', re:/(예약|미팅|약속|회의|내일|모레|다음\s?주|이번\s?주|오늘\s?저녁|오전|오후|\d+\s?시|\d+월\s?\d+일|월요일|화요일|수요일|목요일|금요일|토요일|일요일|휴무|연차)/ },
  { c:'todo',  re:/(해야|해야지|하기|해놓|챙기|챙겨|확인해|확인하|연락|전화|보내|알아보|물어보|정리해|고쳐|바꿔|신청|접수|맡기)/ }
];
function guessCat(t){
  if (!t) return 'think';
  for (var i = 0; i < RULES.length; i++){ if (RULES[i].re.test(t)) return RULES[i].c; }
  return 'think';
}
function refreshGuess(){
  var t = finalTxt;
  autoCat = guessCat(t);
  var use = curCat || autoCat;
  document.querySelectorAll('.cat').forEach(function(b){
    b.classList.toggle('on', b.dataset.c === use && !!t);
  });
  document.getElementById('guess').innerHTML =
    !t ? '' : (curCat ? '' : '말을 보고 <b>' + CAT[autoCat] + '</b>' + ro(CATN[autoCat]) + ' 잡았습니다 — 다르면 눌러서 바꾸세요');
  document.getElementById('saveBtn').disabled = !t;
  document.getElementById('fixBar').style.display = looksRepeated(t) ? 'flex' : 'none';
}
function pickCat(c){
  curCat = (curCat === c) ? null : c;
  refreshGuess();
}

function clearLive(){
  if (finalTxt && !confirm('적힌 내용을 지울까요?')) return;
  finalTxt = ''; baseTxt = ''; sessTxt = ''; curCat = null;
  document.getElementById('live').innerHTML = '';
  refreshGuess();
}

/* ═══════ 저장 ═══════ */
function saveMemo(){
  var t = (document.getElementById('live').innerText || '').trim();
  if (!t) return;
  if (recording) stopRec();
  ITEMS.unshift({ id: 'm' + Date.now() + Math.floor(Math.random()*1000),
                  at: Date.now(), cat: curCat || guessCat(t), text: t, done: false });
  if (save()){
    finalTxt = ''; baseTxt = ''; sessTxt = ''; curCat = null;
    document.getElementById('live').innerHTML = '';
    refreshGuess(); paint();
    toast('저장했습니다');
  }
}

/* ═══════ 목록 ═══════ */
function setFilt(f, btn){
  filt = f;
  document.querySelectorAll('.fb').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  paint();
}

function dayLabel(ts){
  var d = new Date(ts), n = new Date();
  var same = function(a,b){ return a.toDateString() === b.toDateString(); };
  var y = new Date(n.getTime() - 86400000);
  if (same(d,n)) return '오늘';
  if (same(d,y)) return '어제';
  var W = ['일','월','화','수','목','금','토'];
  return (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + W[d.getDay()] + ')';
}
function timeLabel(ts){
  var d = new Date(ts), h = d.getHours(), m = d.getMinutes();
  var ap = h < 12 ? '오전' : '오후'; var hh = h % 12; if (!hh) hh = 12;
  return ap + ' ' + hh + ':' + (m < 10 ? '0' : '') + m;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

function visible(){
  var q = (document.getElementById('srch').value || '').trim().toLowerCase();
  return ITEMS.filter(function(it){
    if (filt === 'open'){ if (it.cat !== 'todo' || it.done) return false; }
    else if (filt !== 'all' && it.cat !== filt) return false;
    if (q && it.text.toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function paint(){
  var list = document.getElementById('list');
  var rows = visible();
  var open = ITEMS.filter(function(i){ return i.cat === 'todo' && !i.done; }).length;
  document.getElementById('cnt').textContent =
    ITEMS.length ? (ITEMS.length + '개' + (open ? ' · 안 끝난 할일 ' + open : '')) : '';

  if (!rows.length){
    list.innerHTML = '<div class="empty">' +
      (ITEMS.length ? '여기에 맞는 메모가 없습니다.' : '아직 메모가 없습니다.<br>🎙를 누르고 편하게 말씀해 보세요.') +
      '</div>';
    paintBkp(); return;
  }

  var html = '', lastDay = '';
  rows.forEach(function(it){
    var d = dayLabel(it.at);
    if (d !== lastDay){ html += '<div class="daysep">' + d + '</div>'; lastDay = d; }
    html += '<div class="memo' + (it.done ? ' done' : '') + '" data-c="' + it.cat + '">' +
      '<div class="mtop">' +
        '<span class="tag" data-c="' + it.cat + '">' + CAT[it.cat] + '</span>' +
        '<span class="mtime">' + timeLabel(it.at) + '</span>' +
      '</div>' +
      '<div class="mtxt" contenteditable="true" data-id="' + it.id + '" ' +
           'onblur="editTxt(this)">' + esc(it.text) + '</div>' +
      '<div class="mrow">' +
        (it.cat === 'todo'
          ? '<button class="mb ok" onclick="toggleDone(\'' + it.id + '\')">' + (it.done ? '↩ 되돌리기' : '✓ 끝냄') + '</button>'
          : '') +
        (looksRepeated(it.text) ? '<button class="mb fix" onclick="cleanOne(\'' + it.id + '\')">🧹 반복 정리</button>' : '') +
        '<button class="mb" onclick="copyOne(\'' + it.id + '\')">복사</button>' +
        '<button class="mb" onclick="cycleCat(\'' + it.id + '\')">종류 바꾸기</button>' +
        '<button class="mb del" onclick="delOne(\'' + it.id + '\')">삭제</button>' +
      '</div>' +
    '</div>';
  });
  list.innerHTML = html;
  paintBkp();
}

function find(id){ for (var i=0;i<ITEMS.length;i++) if (ITEMS[i].id === id) return ITEMS[i]; return null; }

function editTxt(el){
  var it = find(el.dataset.id); if (!it) return;
  var t = el.innerText.trim();
  if (!t){ el.innerText = it.text; return; }
  if (t === it.text) return;
  it.text = t; save(); toast('고쳤습니다');
}
function toggleDone(id){ var it = find(id); if (!it) return; it.done = !it.done; save(); paint(); }
function cycleCat(id){
  var it = find(id); if (!it) return;
  var ks = Object.keys(CAT);
  it.cat = ks[(ks.indexOf(it.cat) + 1) % ks.length];
  if (it.cat !== 'todo') it.done = false;
  save(); paint();
}
function delOne(id){
  var it = find(id); if (!it) return;
  if (!confirm('이 메모를 지울까요?\n\n' + it.text.slice(0, 50) + (it.text.length > 50 ? '…' : ''))) return;
  ITEMS = ITEMS.filter(function(x){ return x.id !== id; });
  save(); paint(); toast('지웠습니다');
}

/* ═══════ 꺼내기 ═══════ */
function asText(rows){
  var out = [], lastDay = '';
  rows.forEach(function(it){
    var d = dayLabel(it.at);
    if (d !== lastDay){ out.push((out.length ? '\n' : '') + '── ' + d + ' ──'); lastDay = d; }
    out.push('[' + CAT[it.cat].replace(/^\S+\s/, '') + ']' + (it.done ? ' (끝)' : '') +
             ' ' + timeLabel(it.at) + '  ' + it.text);
  });
  return out.join('\n');
}
function toClip(s, msg){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){ toast(msg); })
      .catch(function(){ legacyClip(s, msg); });
  } else legacyClip(s, msg);
}
function legacyClip(s, msg){
  var ta = document.createElement('textarea');
  ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e){ toast('복사가 안 됩니다 — 글씨를 길게 눌러 복사해 주세요'); }
  document.body.removeChild(ta);
}
function copyOne(id){ var it = find(id); if (it) toClip(it.text, '복사했습니다'); }
function copyAll(){
  var rows = visible();
  if (!rows.length){ toast('복사할 메모가 없습니다'); return; }
  toClip(asText(rows), rows.length + '개를 복사했습니다');
}
function backup(){
  if (!ITEMS.length){ toast('저장된 메모가 없습니다'); return; }
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  var name = 'laurel-memo-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '.txt';
  var body = 'Laurel Studio 음성 메모 — ' + d.getFullYear() + '.' + (d.getMonth()+1) + '.' + d.getDate() +
             ' 기준 ' + ITEMS.length + '개\n\n' + asText(ITEMS);
  var blob = new Blob(['﻿' + body], { type:'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 400);
  setBkp(); paintBkp(); toast('백업 파일을 내려받았습니다');
}

function paintBkp(){
  var el = document.getElementById('bkp'), at = bkpAt();
  if (!ITEMS.length){ el.textContent = ''; el.className = 'bkp'; return; }
  if (!at){
    el.innerHTML = '메모는 이 폰 안에만 있습니다 — 가끔 백업 파일을 내려받아 두세요.';
    el.className = 'bkp' + (ITEMS.length >= 15 ? ' old' : '');
    return;
  }
  var days = Math.floor((Date.now() - at) / 86400000);
  el.textContent = '마지막 백업 ' + (days === 0 ? '오늘' : days + '일 전');
  el.className = 'bkp' + (days >= 14 ? ' old' : '');
}

/* ═══════ 시작 ═══════ */
load();
refreshGuess();
paint();
document.getElementById('sub').textContent =
  supported() ? '말하면 글로 바뀝니다 · 이 폰 안에만 저장됩니다' : '손으로 적어 저장하실 수 있습니다';
</script>
